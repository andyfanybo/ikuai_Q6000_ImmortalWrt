name: Q6000 Source Update Checker

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: write
  actions: write

env:
  REPO_URL: https://github.com/dailook/immortalwrt-24.10.git
  REPO_BRANCH: openwrt-24.10

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get upstream commit
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          UPSTREAM_SHA=$(git ls-remote "$REPO_URL" "refs/heads/$REPO_BRANCH" | awk '{print $1}')
          [ -n "$UPSTREAM_SHA" ] || { echo "ERROR: 无法获取上游提交"; exit 1; }
          echo "sha=$UPSTREAM_SHA" >> "$GITHUB_OUTPUT"
          echo "Upstream: $UPSTREAM_SHA"

      - name: Restore last seen commit
        id: cache
        uses: actions/cache@v4
        with:
          path: .upstream-commit
          key: q6000-upstream-${{ steps.upstream.outputs.sha }}

      - name: Record upstream commit
        if: steps.cache.outputs.cache-hit != 'true'
        run: echo "${{ steps.upstream.outputs.sha }}" > .upstream-commit

      - name: Trigger Q6000 build
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${{ github.repository }}/dispatches" \
            -f event_type='source-code-update'
